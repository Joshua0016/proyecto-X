# Especificar la versión del formato de Docker Compose
version: '3.8' 

services:
  db_server:
    # Usamos la versión exacta 15.5 para que todos tengan el mismo motor
    image: postgres:15.5-alpine 
    container_name: server_ProyectoX
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d dbProyectoX"]
      interval: 5s
      timeout: 5s
      retries: 10

  admin_panel:
    # Versión específica de pgAdmin
    image: dpage/pgadmin4:8.3
    container_name: pgadmin_proyecto
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "8081:80"
    depends_on:
      db_server:
        condition: service_healthy

  backend:
    build: 
      context: .
      dockerfile: backend/Dockerfile
    container_name: api_proyectoX
    ports:
      - "8080:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Host=db_server;Port=5432;Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD}
    depends_on:
      db_server:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: web_proyectoX
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data: